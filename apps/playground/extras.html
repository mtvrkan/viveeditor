<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>viveEditor — Ek özellikler</title>
  </head>
  <body>
    <main class="page">
      <header class="site">
        <strong>Örnek Dergi</strong>
        <span>Ek özellikler</span>
      </header>
      <label class="field-label" for="article">Makale metni</label>
      <div id="article" class="article" data-testid="extras-editor"></div>
      <p class="output-title" data-testid="errors" role="status"></p>
      <h2 class="output-title">HTML çıktısı</h2>
      <pre class="output" data-testid="output" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/extras.ts"></script>
  </body>
</html>
