name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  version:
    name: version pull request
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          push-with-git-cli: false
          pr-title: "Release packages"
          commit-message: "chore: release packages"

  build-pack:
    name: build and pack
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - id: plan
        run: node scripts/release-plan.mjs check
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm exec turbo run build --force
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm size
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm api:check
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm check:packages
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm audit --prod --audit-level=high
      - if: steps.plan.outputs.publish == 'true'
        run: node scripts/release-plan.mjs pack packs
      - if: steps.plan.outputs.publish == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: packs/viveeditor-sbom.cdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packs
          path: packs/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build-pack
    if: vars.RELEASE_ENABLED == 'true' && needs.build-pack.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm 11.5.1 or newer
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $npm_version is older than 11.5.1, which trusted publishing needs." >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packs
          path: packs
      - name: Publish tarballs in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while IFS="$(printf '\t')" read -r tarball spec; do
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "Already published: $spec"
              continue
            fi
            npm publish "./packs/$tarball" --provenance --access public
          done < packs/order.txt

  github-release:
    name: tag and GitHub release
    needs: [build-pack, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packs
          path: packs
      - name: Create the release with the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-pack.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          gh release create "v$VERSION" packs/viveeditor-sbom.cdx.json \
            --target "$TARGET" \
            --title "viveEditor $VERSION" \
            --notes "Packages published to npm with provenance. Changes are listed in each package's CHANGELOG.md. The attached SBOM covers the whole workspace, development tools included."
